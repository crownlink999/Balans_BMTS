<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6F78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Баланс БМТС">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Баланс БМТС</title>
<style>
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --ink:#12303C; --muted:#5E7482; --line:#D8E2E8;
  --teal:#0E6F78; --teal-d:#0A5961; --teal-l:#DCF0F1;
  --blue:#2A63B8; --blue-l:#E1ECFA;
  --rose:#B5405A; --rose-l:#FAE5EA;
  --amber:#A8620A; --amber-l:#FFF0D2;
  --violet:#5B4BB0; --violet-l:#ECE8FA;
  --ok:#1F7A4D;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(32px + var(--sab))}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--surface);
  padding:calc(7px + var(--sat)) 12px 0;border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(18,48,60,.06)}
.brand{display:flex;align-items:baseline;gap:10px;margin:0 2px 5px}
.brand h1{font-size:17px;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand .ver{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.brand .asof{font-size:12.5px;color:var(--muted);white-space:nowrap}
.brand .tot{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:14px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.2;pointer-events:none}
.search input{width:100%;height:46px;padding:0 64px 0 44px;font-size:18px;color:var(--ink);
  background:#F6F9FB;border:2px solid var(--line);border-radius:14px;outline:none;
  -webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(14,111,120,.14)}
.search input::placeholder{color:#8AA0AC}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.clear{position:absolute;right:5px;top:5px;width:36px;height:36px;border:0;border-radius:10px;
  background:var(--teal);color:#fff;font-size:26px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.clear.on{display:flex}
.clear:active{background:var(--teal-d)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 2px 0}
.hint code{background:#EAF0F4;border-radius:5px;padding:1px 5px;font:inherit;color:var(--teal-d);cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:7px -12px 0;padding:0 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;border:1.5px solid var(--line);background:#F6F9FB;border-radius:10px;padding:6px 5px;
  display:flex;align-items:center;justify-content:center;min-width:0;text-align:center}
.tab b{font-size:12.5px;font-weight:650;white-space:nowrap}
.tab span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.zero{opacity:.55}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on span{color:#B9CCD6}
.tab.on.zero{opacity:1}
main{max-width:820px;margin:0 auto;padding:12px 12px 0}
.stat{font-size:13px;color:var(--muted);margin:2px 2px 10px}
.stat b{color:var(--ink)}
.empty,.loading{background:var(--surface);border:1px dashed #B9C9D2;border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty button{margin-top:12px;border:0;background:var(--teal);color:#fff;border-radius:10px;padding:10px 18px;font-weight:600}

.g{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.gh{display:flex;gap:12px;padding:12px 14px 10px;align-items:flex-start}
.gh .l{flex:1;min-width:0}
.code{font:600 12.5px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--teal-d);
  background:var(--teal-l);padding:2px 7px;border-radius:6px;display:inline-block;letter-spacing:.2px}
.name{margin:6px 0 0;font-size:15px;font-weight:560;word-break:break-word}
.qty{text-align:right;flex:0 0 auto}
.qty b{display:block;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums;font-weight:700}
.qty i{font-style:normal;font-size:12.5px;color:var(--muted)}
.qty small{display:block;font-size:11.5px;color:var(--amber);margin-top:2px}
mark{background:#FFE08A;color:inherit;border-radius:3px;padding:0 1px}
.sumtot{margin-left:auto;align-self:center;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.sumtot b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.inc{background:var(--blue-l);color:var(--blue)}
.chip.iss{background:var(--rose-l);color:var(--rose)}
.chip.tot{background:var(--violet-l);color:var(--violet)}
.chip.bal{background:var(--teal-l);color:var(--teal-d)}
.chip.me{background:#E3F1EA;color:var(--ok)}
.chip.vir{background:#E7EEF2;color:#41606F}
.chip:active{filter:brightness(.93)}
.rows{border-top:1px solid var(--line)}
.r{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #EAF0F3;padding:10px 14px}
.r:last-child{border-bottom:0}
.r:active,.r.open{background:#F4F8FA}
.rm{display:flex;gap:10px;align-items:center}
.rm .w{flex:1;min-width:0}
.rm .w strong{font-weight:600;display:block;font-size:14.5px}
.rm .w span.l2{display:block;margin-top:2px;word-break:normal;overflow-wrap:break-word}
.rm .w span{font-size:12.5px;color:var(--muted);word-break:break-all}
.rm .q{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;white-space:nowrap}
.rm .q small{display:block;font-size:11px;font-weight:500;color:var(--muted);text-align:right;line-height:1.2}
.rm .q i{font-style:normal;font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.rm .chev{width:16px;height:16px;stroke:#9DB0BB;fill:none;stroke-width:2.4;transition:transform .15s;flex:0 0 auto}
.r.open .chev{transform:rotate(90deg)}
.det{display:none;margin-top:9px;padding:10px 12px;background:#F1F6F8;border-radius:10px;font-size:13.5px}
.r.open .det{display:block}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0}
.det dt{color:var(--muted)}
.det dd{margin:0;word-break:break-word;font-weight:560}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px}
.tag.mt{background:var(--amber-l);color:var(--amber);border:1px solid #F0C97A}
.tag.ok{background:#DFF3E7;color:var(--ok)}
.tag.part{background:var(--amber-l);color:var(--amber)}
.tag.none{background:var(--rose-l);color:var(--rose)}
.tag.plan{background:var(--violet-l);color:var(--violet)}
.tag.date{background:var(--blue-l);color:var(--blue)}
.tag.rs{background:var(--rose-l);color:var(--rose)}
.tag.ini{background:#E7EEF2;color:#41606F}
.warn{margin-top:8px;padding:8px 10px;background:var(--amber-l);border:1px solid #F0C97A;border-radius:9px;color:#7A4606;font-size:13px}
.more{display:block;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;color:var(--teal-d);margin:2px 0 10px}
.fold{display:block;width:100%;border:0;background:#F6F9FB;color:var(--teal-d);font-weight:600;font-size:13px;padding:9px 14px;text-align:left}
.top-btn{position:fixed;right:14px;bottom:calc(16px + var(--sab));width:46px;height:46px;border:0;border-radius:50%;
  background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(18,48,60,.35);display:none;align-items:center;justify-content:center}
.top-btn.on{display:flex}
.top-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4}
:focus-visible{outline:3px solid #6FB8BF;outline-offset:2px}
@media (max-width:375px){.fbar{gap:5px}.fc,.fc.rem{padding:7px 8px}.fc small{margin-left:3px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.tabs{margin:8px 0 0;padding:0 0 10px}.top{padding-left:max(12px,calc((100vw - 820px)/2));padding-right:max(12px,calc((100vw - 820px)/2))}}

.seg{display:flex;gap:8px;margin:0 0 7px}
.seg button{flex:1;min-width:0;border:2px solid var(--line);background:#F6F9FB;border-radius:11px;padding:6px 10px;text-align:center}
.seg button b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.seg button span{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on span{color:#B9CCD6}
.fbar{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 0;align-items:center}
.fc{border:1.5px solid #CFC9EE;background:var(--violet-l);color:var(--violet);border-radius:999px;padding:7px 10px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.fc small{font-weight:600;opacity:.75;margin-left:4px;font-size:11.5px}
.fc.on{background:var(--violet);border-color:var(--violet);color:#fff}
.fc.zero{opacity:.45}
.fc.rem{white-space:nowrap;padding:7px 10px;font-size:13.5px;border-color:#EBD98C;background:#FFF3C2;color:#6B5200}
.fc.rem.on{background:#C99A00;border-color:#C99A00;color:#fff}
.fc.yr{border-color:#BFDDE0;background:var(--teal-l);color:var(--teal-d)}
.fc.yr.on{background:var(--teal);border-color:var(--teal);color:#fff}
.fx{border:0;background:none;color:var(--teal-d);font-weight:600;font-size:13px;padding:6px 4px;text-decoration:underline}
.legend{font-size:12px;color:var(--muted);margin:5px 2px 9px}
.frow.res{flex-wrap:nowrap}
.frow.res{gap:5px}
.frow.res .fsel{flex:1 1 0;min-width:62px;width:auto;height:34px;font-size:12.5px;padding:0 4px}
.frow.res .fc{flex:0 0 auto;padding:6px 7px;font-size:12.5px;white-space:nowrap}
.frow.res .fx{flex:0 0 auto;white-space:nowrap;padding:6px 0;font-size:12.5px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.fbtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#F6F9FB;border-radius:11px;padding:6px 12px;font-weight:650;font-size:13.5px;margin:0}
.fsel{height:36px;min-width:0;max-width:100%;flex:1 1 150px;border:1.5px solid var(--line);background:#F6F9FB;border-radius:11px;padding:0 10px;font:650 13.5px/1 inherit;font-family:inherit;color:var(--ink)}
.fsel.act{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.fbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.fbtn.act{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.fbtn em{font-style:normal;background:var(--teal);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.ypanel{padding:2px 0 10px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.nums>div{background:#F1F6F8;border-radius:10px;padding:7px 9px;min-width:0}
.nums small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.nums b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.nums i{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:3px}
.nums .rem.zero{background:#FFE98A}
.nums .rem.pos{background:#DDF0DF}
.nums .rem b,.nums .rem small,.nums .rem i{color:#111}
.chip.stk.ok{background:#DDF0DF;color:#0E4D24;font-weight:700}
.chip.stk.none{background:#EEF1F3;color:#6A7A86;cursor:default}
.gnums{padding:0 14px 4px}
.ol{padding:12px 14px;border-top:1px solid #EAF0F3}
.olt{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.olt .tag{margin:0;font-size:12.5px;padding:2px 8px}
.olt .od{margin-left:auto;font-size:13px;color:var(--muted)}
.olt .od b{color:var(--ink)}
.sup{margin-top:6px;font-size:14.5px;font-weight:600;word-break:break-word}
.oact{margin-top:8px;font-size:13px;color:var(--amber);font-weight:600}
.meb{border-top:2px solid #DDE8E2;background:#F7FBF8}
.mebh{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:11px 14px}
.mebh .chev{width:16px;height:16px;stroke:var(--ok);fill:none;stroke-width:2.4;transition:transform .15s;flex:0 0 auto}
.meb.open .mebh .chev{transform:rotate(90deg)}
.whb{border-top:1px solid var(--line)}
.whh{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:11px 14px}
.whh b{font-size:14px;color:var(--teal-d)}
.whh span{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.whh .chev{width:16px;height:16px;stroke:var(--teal-d);fill:none;stroke-width:2.4;transition:transform .15s;flex:0 0 auto}
.whb.open .whh .chev{transform:rotate(90deg)}
.whbody{display:none}
.whb.open .whbody{display:block}
.resb{background:#F5F8FD;border-top-color:#DCE6F5}
.resb .mebh b{color:var(--blue)}
.resb .mebh .chev{stroke:var(--blue)}
.resb .ol{border-top:1px dashed #D3DEF0}
.mebrest{display:none}
.meb.all .mebrest{display:block}
.mebbody{display:none}
.meb.open .mebbody{display:block}
.lhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.lhead .stat{margin:0}
.copybtn{border:0;background:var(--teal);color:#fff;border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px}
.cpi{border:0;background:transparent;padding:5px;margin-left:3px;vertical-align:middle;border-radius:8px;line-height:0;cursor:pointer}
.cpi svg{width:17px;height:17px;stroke:var(--teal-d);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cpi .i-ok{display:none}
.cpi.ok .i-copy{display:none}
.cpi.ok .i-ok{display:inline}
.cpi.ok svg{stroke:var(--ok)}
.cpi:active{background:var(--teal-l)}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.cbtns.three,.cbtns.two{flex-wrap:nowrap}
.cbtns.three .copybtn{flex:1 1 0;min-width:0;padding:8px 4px;white-space:nowrap}
.cbtns.two .copybtn{flex:1 1 auto;min-width:0;white-space:nowrap;padding:8px 8px}
.bi{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:4px}
.cmsg{width:100%;font-size:13px;font-weight:700;color:var(--ok)}
.cmsg:empty{display:none}
.cmsg.bad{color:var(--rose)}
.copybtn.alt{background:#fff;color:var(--teal-d);box-shadow:inset 0 0 0 2px var(--teal)}
.copybtn.alt.done{background:var(--ok);color:#fff;box-shadow:none}
.copybtn:active{background:var(--teal-d)}
.copybtn.done{background:var(--ok)}
.bd{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed #D5E0E6;font-size:13.5px}
.bd:last-child{border-bottom:0}
.bd span{color:var(--muted);min-width:0}
.bd b{white-space:nowrap;font-variant-numeric:tabular-nums}
.sr .w strong{margin-top:4px;line-height:1.3}
.sr .w .code{align-self:flex-start}
.nf{padding:10px 14px;font-size:13px;color:var(--muted);word-break:break-word;line-height:1.7}
.mebh b{font-size:14px;color:var(--ok)}
.mebh span{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.meb .ol{border-top:1px dashed #D5E6DC}
.meb .ol:first-of-type{border-top:0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Баланс</h1><span class="asof" id="asof"></span><span class="ver" id="ver" title="Нажми, чтобы обновить приложение"></span></div>
  <div class="seg" id="seg"></div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Поиск" aria-label="Поиск">
    <button class="clear" id="clr" aria-label="Очистить поиск">&times;</button>
  </div>
  <div class="hint" id="hint">К примеру, если надо поискать трубу 89 диаметра, то пиши <code data-ex="*труба*89*">*труба*89*</code>.</div>
  <div id="ctl"></div>
</header>
<main id="main"><div class="loading">Загрузка данных…</div></main>
<button class="top-btn" id="up" aria-label="Наверх"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>

<script>
(function(){
'use strict';
var BT=[
  {id:'bal',t:'Баланс',s:'склады'},
  {id:'res',t:'Резервы',s:'резервы цехов'},
  {id:'inc',t:'Вне баланса',s:'поступление'},
  {id:'iss',t:'Выдача МТ',s:'открытые МТ'},
  {id:'tot',t:'Итого',s:'баланс+пост.−выдача'},
  {id:'vir',t:'Цеха',s:'виртуальные склады'}
];
var LOOK={a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у',k:'к',m:'м',t:'т',b:'в',h:'н','ё':'е'};
var CUR=new Date().getFullYear()%100;
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[acepoxykmtbhё]/g,function(c){return LOOK[c]})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){var x=Math.round(n*1000)/1000;return x.toLocaleString('ru-RU',{maximumFractionDigits:3})}
function fdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'.'+m[2]+'.'+m[1]:(s||'')}
function isMT(bin){return /(^|[^a-zа-я])(mt|мт)\s*[-_]?\d/i.test(bin||'')}
function batchDate(b){
  /* партия = ГГММДД (+ _001 / _RFD …): 261105_001 -> 05.11.2026 */
  var m=/^(\d{2})(\d{2})(\d{2})(?:[_-][A-Za-z0-9]+)?$/.exec(b||'');
  if(!m)return '';
  var y=2000+(+m[1]),mo=+m[2],d=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d||y<2014||dt>new Date())return '';
  return m[3]+'.'+m[2]+'.'+y;
}
function batchYear(b){var d=batchDate(b);return d?d.slice(-4):''}
function batchLine(b){var dt=batchDate(b);return dt?'Дата оприход.: '+dt:(b?'Партия: '+esc(b):'партия не указана')}
function planLabel(c){
  var m=/^([GT])(\d{2})$/i.exec(c||'');
  if(!m)return c||'—';
  return m[1].toUpperCase()==='G'?c+' · бюджет 20'+m[2]:c+' · долгосрочный контракт';
}
/* порядок: текущий год, будущие, прошлые; сначала G, потом T */
function planRank(c){
  var m=/^([GT])(\d{2})$/i.exec(c||'');
  if(!m)return 999;
  var yy=+m[2],base=m[1].toUpperCase()==='G'?0:100;
  return base+(yy===CUR?0:yy>CUR?yy-CUR:50+(CUR-yy));
}
function statusCls(st){return /полн/i.test(st)?'ok':/частич/i.test(st)?'part':'none'}
function gkey(code,name){return /без\s*кода/i.test(code)?'без кода|'+name:code}

/* ---------- поиск (как в Excel) ---------- */
var CODEI={res:4,bal:0,vir:0,inc:0,tot:0,iss:3,me:3};
function parseQ(q){
  q=q.trim();
  var qn=q.replace(/[–—−‑]/g,'-'),cs=qn.match(/\d{3}-\d{5}/g);
  if(cs&&cs.length>=1&&!qn.replace(/\d{3}-\d{5}/g,'').replace(/[\s,;]+/g,'')){
    var set={},ord=[];cs.forEach(function(c){if(!set[c]){set[c]=1;ord.push(c)}});
    return {codes:set,order:ord,wild:null,toks:ord.length===1?[{s:ord[0]}]:[]};
  }
  if(/[*?]/.test(q)){
    var n=norm(q),src=n.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*+/g,'.*').replace(/\?/g,'.');
    return {wild:new RegExp('^'+src+'$'),toks:n.split(/[*?]+/).filter(Boolean).map(function(t){return {s:t}})};
  }
  return {wild:null,toks:norm(q).split(/\s+/).filter(Boolean).map(function(t){return {s:t}})};
}
function hit(i,tab,P){
  if(P.codes)return !!P.codes[D[tab][i][CODEI[tab]]];
  if(P.wild){var f=F[tab][i];for(var k=0;k<f.length;k++)if(P.wild.test(f[k]))return true;return false}
  var h=H[tab][i];
  for(var j=0;j<P.toks.length;j++)if(h.indexOf(P.toks[j].s)<0)return false;
  return true;
}
function match(tab,P){
  var n=D[tab].length,idx=[],all=!P.codes&&!P.toks.length;
  for(var i=0;i<n;i++)if(all||hit(i,tab,P))idx.push(i);
  return idx;
}
function hl(orig,toks){
  if(!toks||!toks.length)return esc(orig);
  var n=norm(orig),rg=[],i;
  toks.forEach(function(t){var p=0;while((i=n.indexOf(t.s,p))>=0){rg.push([i,i+t.s.length]);p=i+t.s.length}});
  if(!rg.length)return esc(orig);
  rg.sort(function(a,b){return a[0]-b[0]});
  var out='',pos=0;
  rg.forEach(function(r){if(r[1]<=pos)return;var a=Math.max(r[0],pos);out+=esc(orig.slice(pos,a))+'<mark>'+esc(orig.slice(a,r[1]))+'</mark>';pos=r[1]});
  return out+esc(orig.slice(pos));
}

function meSort(a,b){
  var x=planRank(D.me[a][0])-planRank(D.me[b][0]);
  if(x)return x;
  var p=D.me[a][9],q=D.me[b][9];return p<q?1:p>q?-1:0;
}
function resSort(a,b){var x=D.res[a],y=D.res[b];return x[0]<y[0]?-1:x[0]>y[0]?1:(x[11]<y[11]?-1:x[11]>y[11]?1:0)}

  Object.keys(MEBY).forEach(function(k){MEBY[k].sort(meSort)});
  BALSUM={};BALBY={};D.bal.forEach(function(r,i){BALSUM[r[0]]=(BALSUM[r[0]]||0)+r[4];(BALBY[r[0]]=BALBY[r[0]]||[]).push(i)});

  var pl={};D.me.forEach(function(r){pl[r[0]]=1});
  G.plans=Object.keys(pl).sort(function(a,b){return planRank(a)-planRank(b)});
}
function hasSel(o){for(var k in o)if(o[k])return true;return false}
function selList(o){return Object.keys(o).filter(function(k){return o[k]})}

function compute(){
  var C={Pm:parseQ(S.q.me),Pb:parseQ(S.q.bms),res:{},pre:{}};
  C.meAll=match('me',C.Pm);
  C.planCnt={};
  C.meAll.forEach(function(i){var p=D.me[i][0];C.planCnt[p]=(C.planCnt[p]||0)+1});
  C.mePlan=hasSel(S.plans)?C.meAll.filter(function(i){return S.plans[D.me[i][0]]}):C.meAll;
  C.remCnt={pos:0,zero:0};
  C.mePlan.forEach(function(i){if(D.me[i][8]>0)C.remCnt.pos++;else C.remCnt.zero++});
  C.me=S.rem==='pos'?C.mePlan.filter(function(i){return D.me[i][8]>0}):S.rem==='zero'?C.mePlan.filter(function(i){return !(D.me[i][8]>0)}):C.mePlan;
  BT.forEach(function(t){
    var ix=match(t.id,C.Pb);C.pre[t.id]=ix;
    var rs=((t.id==='bal'||t.id==='vir')&&hasSel(S.years))?ix.filter(function(i){return S.years[Y[t.id][i]||'none']}):ix;
    if(t.id==='res'&&(S.resBal||S.resDiff))rs=rs.filter(function(i){var r=D.res[i];return (!S.resBal||BALSUM[r[4]]>0)&&(!S.resDiff||r[9]>0)});
    C.yr=C.yr||{};C.yr[t.id]=rs;
    C.res[t.id]=(t.id==='vir'&&S.shop)?rs.filter(function(i){return D.vir[i][3]===S.shop}):(t.id==='res'&&S.shopRes)?rs.filter(function(i){return D.res[i][0]===S.shopRes}):rs;
  });
  return C;
}
function groups(tab,idx){
  var arr=D[tab],c=CFG[tab],m={},order=[];
  idx.forEach(function(i){
    var r=arr[i],k=gkey(r[c.c],r[c.n]);
    if(!m[k]){m[k]={code:r[c.c],name:r[c.n],unit:r[c.u],rows:[],sum:0,emp:0,ord:0,got:0,minRank:999};order.push(m[k])}
    var g=m[k];g.rows.push(i);g.sum+=r[c.q];
    if(tab==='me'){g.ord+=r[6];g.got+=r[7];var pr=planRank(r[0]);if(pr<g.minRank)g.minRank=pr}
    if(tab==='bal'&&isMT(r[7]))g.emp+=r[4];
  });
  if(tab==='res')order.forEach(function(g){g.rows.sort(resSort)});
  if(tab==='me'){
    order.forEach(function(g){g.rows.sort(meSort)});
    order.sort(function(a,b){return a.minRank-b.minRank||(a.code<b.code?-1:a.code>b.code?1:0)});
  }
  return order;
}

function chips(code,extra,pre){

    if(c.bal[code])o+=ch('bal','bms:bal','Баланс · '+c.bal[code]);
    if(c.inc[code])o+=ch('inc','bms:inc','Вне баланса · '+c.inc[code]);
    if(c.iss[code])o+=ch('iss','bms:iss','Выдача МТ · '+c.iss[code]);
    if(c.tot[code]!==undefined)o+=ch('tot','bms:tot','Итого · '+fmt(c.tot[code]));
    if(c.vir[code])o+=ch('vir','bms:vir','Цеха · '+c.vir[code]);
    if(c.res[code])o+=ch('inc','bms:res','Резервы · '+c.res[code]);

    if(tab!=='tot'&&c.tot[code]!==undefined)o+=ch('tot','bms:tot','Итого · '+fmt(c.tot[code]));

var LV={res:{q:7,lab:'потребность',u:6,n:5,c:4},bal:{q:4,lab:'доступный запас',u:2,n:1,c:0},vir:{q:4,lab:'доступный запас',u:2,n:1,c:0},tot:{q:2,lab:'доступный запас',u:-1,n:1,c:0},
  inc:{q:3,lab:'получено',u:2,n:1,c:0},iss:{q:6,lab:'выдано',u:5,n:4,c:3},me:{q:8,lab:'еще поставить',u:5,n:4,c:3}};
function tnum(x){return String(Math.round(x*1000)/1000).replace('.',',')}
function tcell(t){return String(t==null?'':t).replace(/[\t\r\n]+/g,' ').trim()}
function buildTable(tab,idx,keepOrder){
  var rows;
  if(tab==='vir'){
    rows=[['Цех (обозначение склада)','Код материала','Наименование','Партия','Дата оприходования','Доступный запас','Ед. изм.']];
    idx.forEach(function(i){var r=D.vir[i];rows.push([r[3],r[0],r[1],r[5],batchDate(r[5]),tnum(r[4]),r[2]])});
  }else if(tab==='me'){
    rows=[['План закупа','Код материала','Наименование','Объём заказа','Поступило','Еще поставить','Дата поставки','Имя поставщика']];
    (keepOrder?idx:idx.slice().sort(meSort)).forEach(function(i){var r=D.me[i];rows.push([r[0],r[3],r[4],tnum(r[6]),tnum(r[7]),tnum(r[8]),fdate(r[9]),r[1]])});
  }else{
    rows=[['Цех','Плановик','Принимающий склад','Резервирование','Код материала','Наименование','Ед. изм.','Объём потребности','Сокращ. количество','Размер разницы','Вид движения','Дата потребности','В наличии (баланс)']];
    idx.forEach(function(i){var r=D.res[i];rows.push([r[0],r[1],r[2],r[3],r[4],r[5],r[6],tnum(r[7]),tnum(r[8]),tnum(r[9]),r[10],fdate(r[11]),BALSUM[r[4]]>0?tnum(BALSUM[r[4]]):'0'])});
    rows=dropEmptyCols(rows);
  }
  return rows.map(function(r){return r.map(tcell).join('\t')}).join('\n');
}
function dropEmptyCols(rows){
  /* убирает колонки, в которых ни в одной строке данных нет значения (заголовок — первая строка) */
  var keep=[];
  for(var j=0;j<rows[0].length;j++){
    var has=false;for(var i=1;i<rows.length;i++){if(tcell(rows[i][j])!==''){has=true;break}}
    if(has)keep.push(j);
  }
  return rows.map(function(r){return keep.map(function(j){return r[j]})});
}
function tableHead(statH,tab,idx){
  S.copyText=function(){return buildTable(tab,idx)};S.copyN=idx.length;
  return '<div class="lhead">'+statH+twoBtns()+CMSG+'</div>';
}
function shortTable(items,L){
  /* кратко: код, наименование, сумма (для баланса это доступный запас), ед. изм. */
  var lab=L.lab.charAt(0).toUpperCase()+L.lab.slice(1);
  return [['Код материала','Наименование',lab,'Ед. изм.'].join('\t')].concat(items.map(function(g){
    return [g.code,tcell(g.name),tnum(g.sum),tcell(g.unit)].join('\t');
  })).join('\n');
}
function summarize(tab,idx){
  var L=LV[tab],arr=D[tab],m={},order=[];
  idx.forEach(function(i){var r=arr[i],c=r[L.c],k=gkey(c,r[L.n]);
    if(!m[k]){m[k]={code:c,name:r[L.n],unit:L.u<0?(G.unit[c]||''):r[L.u],sum:0};order.push(k)}
    m[k].sum+=r[L.q]});
  return order.map(function(k){return m[k]});
}

function normalCopyHead(tab,idx,statH){
  /* обычный поиск (по названию и т.п.): две кнопки копирования по ВСЕМ найденным материалам, таблицы строятся при нажатии */
  var items=summarize(tab,idx),L=LV[tab],mc={},found=[];
  items.forEach(function(it){if(!/без\s*кода/i.test(it.code)&&!mc[it.code]){mc[it.code]=it;found.push(it.code)}});
  S.copyShort=function(){return shortTable(items,L)};
  S.copyFull=function(){return fullTable(found,mc)};
  return '<div class="lhead">'+statH+COPYBTNS+CMSG+'</div>';
}
function fullTable(found,m){
  /* подробно: сверху свод (код, наименование, ед. изм., доступный запас), ниже отдельными блоками «Склады» и «Резервы цехов» */
  var out=[];
  function line(a){out.push(a.map(tcell).join('\t'))}
  line(['Код материала','Наименование','Ед. изм.','Доступный запас']);
  found.forEach(function(c){line([c,m[c].name,G.unit[c]||m[c].unit,tnum(BALSUM[c]||0)])});
  var wr=[];
  found.forEach(function(c){(BALBY[c]||[]).forEach(function(i){var r=D.bal[i];
    wr.push([c,m[c].name,r[3],r[5],batchDate(r[5]),tnum(r[4]),r[2],isMT(r[7])?'забрано по МТ ('+r[7]+')':''])})});
  if(wr.length){
    out.push('');line(['СКЛАДЫ']);
    line(['Код материала','Наименование','Склад (зона)','Партия','Дата оприходования','Доступный запас','Ед. изм.','Примечание']);
    wr.forEach(line);
  }
  var rr=[];
  found.forEach(function(c){(RESBY[c]||[]).forEach(function(i){rr.push([c,m[c].name,D.res[i]])})});
  if(rr.length){
    out.push('');line(['РЕЗЕРВЫ ЦЕХОВ']);
    var tbl=[['Код материала','Наименование','Цех','Плановик','Объём потребности','Сокращ. количество','Размер разницы','Ед. изм.','Дата потребности','Вид движения','Принимающий склад','Резервирование']];
    rr.forEach(function(x){var r=x[2];tbl.push([x[0],x[1],r[0],r[1],tnum(r[7]),tnum(r[8]),tnum(r[9]),r[6],fdate(r[11]),r[10],r[2],r[3]])});
    dropEmptyCols(tbl).forEach(line);
  }
  return out.join('\n');
}
function listHead(tab,idx,P){
  /* поиск списком кодов: шапка со сводкой, кнопка копирования для Excel и список кодов, которых нет; дальше идут обычные карточки */
  var L=LV[tab],arr=D[tab],m={};
  idx.forEach(function(i){var r=arr[i],c=r[L.c];if(!m[c])m[c]={name:r[L.n],unit:L.u<0?(G.unit[c]||''):r[L.u],sum:0};m[c].sum+=r[L.q]});
  var found=P.order.filter(function(c){return m[c]}),miss=P.order.filter(function(c){return !m[c]});
  if(tab==='me'){
    var pos={};P.order.forEach(function(c,i){pos[c]=i});
    S.copyText=function(){return buildTable('me',idx.slice().sort(function(a,b){return (pos[D.me[a][3]]-pos[D.me[b][3]])||meSort(a,b)}),true)};
    S.copyN=idx.length;
  }else{
    S.copyShort=function(){return shortTable(found.map(function(c){return {code:c,name:m[c].name,unit:m[c].unit,sum:m[c].sum}}),L)};
    S.copyFull=function(){return fullTable(found,m)};
    S.copyN=found.length;
  }
  var h='<div class="lhead"><div class="stat">'+(P.order.length===1?'Код <b>'+esc(P.order[0])+'</b>: '+(found.length?'найден':'нет в этой вкладке'):'По перечню: <b>'+P.order.length+'</b> кодов · найдено: <b>'+found.length+'</b> · нет в этой вкладке: <b>'+miss.length+'</b>')+'</div>'+

  }
  return h;
}

    if(tab==='inc')dcmp=function(a,b){return D.inc[b][4]<D.inc[a][4]?-1:D.inc[b][4]>D.inc[a][4]?1:0};
    if(tab==='iss')dcmp=function(a,b){return D.iss[b][0]<D.iss[a][0]?-1:D.iss[b][0]>D.iss[a][0]?1:0};
    ix.sort(function(a,b){return (P.codes?pos[D[tab][a][CODEI[tab]]]-pos[D[tab][b][CODEI[tab]]]:0)||dcmp(a,b)});
    items=ix;shown=cap(items.length);
    for(var k=0;k<shown;k++){var x=items[k];html+=tab==='inc'?incCard(x,toks):tab==='iss'?issCard(x,toks):totCard(x,toks)}
    stat='<div class="stat">Позиций: <b>'+fmt(items.length)+'</b></div>';
  }
  (function(){
    var seen={},arr=[];
    items.forEach(function(it){
      var c=(typeof it==='object')?it.code:D[tab][it][CODEI[tab]];
      if(c&&!/без\s*кода/i.test(c)&&!seen[c]){seen[c]=1;arr.push(c)}
    });
    S.copyCodes=arr;
  })();
  var withCopy=tab==='me'||(sec==='bms'&&(tab==='res'||tab==='vir')),twoBtn=sec==='bms'&&(tab==='bal'||tab==='tot'),codesOnly=sec==='bms'&&(tab==='inc'||tab==='iss');
  html=(P.codes?lh:(twoBtn?normalCopyHead(tab,idx,stat):(withCopy?tableHead(stat,tab,idx):(codesOnly?'<div class="lhead">'+stat+'<div class="cbtns">'+CODEBTN+'</div>'+CMSG+'</div>':stat))))+html;
  if(shown<items.length)html+='<button class="more" data-more="1">Показать ещё ('+fmt(items.length-shown)+')</button>';
  $main.innerHTML=html;
}
function emptyBox(msg,isMe){
  var q=S.q[S.sec];
  $main.innerHTML='<div class="empty"><b>Ничего не найдено</b>'+(msg||(q?'Попробуй короче или со звёздочкой, например <code>'+esc(q.split(/\s+/)[0].replace(/\*/g,''))+'*</code>.'+(isMe?'':' Проверь другие вкладки: в счётчиках видно, где есть совпадения.'):'Нет данных.'))+
    (q?'<br><button data-clear="1">Очистить поиск</button>':'')+'</div>';
}
function render(){
  var C=compute();
  renderSeg(C);renderCtl(C);renderMain(C);
  $hint.style.display=S.q[S.sec]?'none':'';
  $q.placeholder=S.sec==='me'?'ME2N: материал, поставщик, статус…':'Материал, код, склад, партия…';
  document.getElementById('ver').textContent='v'+APP_BUILD.v+' · '+APP_BUILD.t;
  var asof=document.getElementById('asof');
  asof.textContent=S.sec==='me'?(D.me_asof?'ME2N на '+D.me_asof+(D.asof?'.'+D.asof.slice(-4):''):''):(D.asof?'на '+D.asof:'');
}

/* ---------- события ---------- */
function writeClip(text,cb){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);cb(ok);
  }
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(function(){cb(true)},fallback);else fallback();
}
function copyText(text,btn,okMsg){
  var box=btn.closest('.lhead'),mb=box&&box.querySelector('.cmsg'),oldHtml=btn.innerHTML;
  writeClip(text,function(ok){
    var msg=ok?(okMsg||'Скопировано ✓'):'Не удалось скопировать';
    btn.classList.toggle('done',ok);
    if(mb){mb.textContent=msg;mb.classList.toggle('bad',!ok)}else btn.textContent=msg;
    setTimeout(function(){btn.classList.remove('done');if(mb)mb.textContent='';else btn.innerHTML=oldHtml},2200);
  });
}
function copyIcon(btn){
  writeClip(btn.getAttribute('data-cpcode'),function(ok){
    if(!ok)return;btn.classList.add('ok');setTimeout(function(){btn.classList.remove('ok')},1100);
  });
}
var tm=null;
function setQ(v){S.q[S.sec]=v;S.limit=50;$clr.classList.toggle('on',!!v);if($q.value!==v)$q.value=v;render()}
function setSec(sec){
  S.sec=sec;S.limit=50;S.yOpen=false;
  try{localStorage.setItem('bmts_sec',sec)}catch(e){}
  $q.value=S.q[sec];$clr.classList.toggle('on',!!S.q[sec]);
}
$q.addEventListener('input',function(){clearTimeout(tm);var v=$q.value;$clr.classList.toggle('on',!!v);tm=setTimeout(function(){S.q[S.sec]=v;S.limit=50;render()},110)});
$q.addEventListener('paste',function(e){
  var t=(e.clipboardData||window.clipboardData).getData('text');
  if(/[\r\n\t;,]/.test(t)){e.preventDefault();var v=t.replace(/[\r\n\t;,]+/g,' ').replace(/\s+/g,' ').trim(),a=$q.selectionStart,b=$q.selectionEnd;
    $q.value=$q.value.slice(0,a)+v+$q.value.slice(b);$q.dispatchEvent(new Event('input'))}
});
$q.addEventListener('keydown',function(e){if(e.key==='Enter')$q.blur();if(e.key==='Escape')setQ('')});
$clr.addEventListener('click',function(){setQ('');$q.focus()});
$hint.addEventListener('click',function(e){var c=e.target.closest('[data-ex]');if(c){setQ(c.getAttribute('data-ex'));window.scrollTo(0,0)}});
document.querySelector('.top').addEventListener('click',function(e){
  var t=e.target,b;
  if(t.closest('#ver')){
    var kill=[];if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)kill.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
    if(window.caches)kill.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
    Promise.all(kill).then(function(){location.reload()},function(){location.reload()});return;
  }
  if((b=t.closest('[data-sec]'))){setSec(b.getAttribute('data-sec'));render();window.scrollTo(0,0);return}
  if((b=t.closest('[data-tab]'))){S.tab=b.getAttribute('data-tab');S.limit=50;render();window.scrollTo(0,0);return}
  if((b=t.closest('[data-plan]'))){var p=b.getAttribute('data-plan');S.plans[p]=!S.plans[p];S.limit=50;render();return}
  if(t.closest('[data-planclear]')){S.plans={};S.limit=50;render();return}
  if(t.closest('[data-resbal]')){S.resBal=!S.resBal;S.limit=50;render();return}
  if(t.closest('[data-resdiff]')){S.resDiff=!S.resDiff;S.limit=50;render();return}
  if(t.closest('[data-resclear]')){S.shopRes='';S.resBal=false;S.resDiff=false;S.limit=50;render();return}
  if((b=t.closest('[data-rem]'))){S.rem=b.getAttribute('data-rem');S.limit=50;render();return}
  if(t.closest('[data-yrtoggle]')){S.yOpen=!S.yOpen;render();return}
  if((b=t.closest('[data-yr]'))){var y=b.getAttribute('data-yr');S.years[y]=!S.years[y];S.limit=50;render();return}
  if(t.closest('[data-yrclear]')){S.years={};S.limit=50;render();return}
});
$ctl.addEventListener('change',function(e){var sel=e.target.closest('[data-shop]');if(sel){if(sel.getAttribute('data-shop')==='res')S.shopRes=sel.value;else S.shop=sel.value;S.limit=50;render()}});
$main.addEventListener('click',function(e){
  var t=e.target,go=t.closest('[data-go]');
  if(go){
    var g=go.getAttribute('data-go'),code=go.getAttribute('data-q');
    if(g==='me'){S.q.me=code;S.plans={};S.rem='';setSec('me')}
    else{S.q.bms=code;S.tab=g.split(':')[1];S.years={};if(S.tab==='res'){S.shopRes='';S.resBal=false;S.resDiff=false}setSec('bms')}
    render();window.scrollTo(0,0);return;
  }
  var cp=t.closest('[data-copy]');
  var ci=t.closest('[data-cpcode]');
  if(ci){copyIcon(ci);return}
  if(cp&&cp.getAttribute('data-copy')==='codes'){var cc=S.copyCodes||[];copyText(cc.join('\n'),cp,cc.length?'Скопировано ✓ (кодов: '+cc.length+')':'Нет кодов');return}
  if(cp){var kind=cp.getAttribute('data-copy'),src=kind==='short'?S.copyShort:kind==='full'?S.copyFull:S.copyText;copyText(typeof src==='function'?src():(src||''),cp);return}
  var wt=t.closest('[data-whtoggle]');
  if(wt){var wk=wt.getAttribute('data-whtoggle');S.open[wk]=!S.open[wk];wt.parentNode.classList.toggle('open',!!S.open[wk]);return}
  var mm=t.closest('[data-mebmore]');
  if(mm){var mk2=mm.getAttribute('data-mebmore');S.unfold[mk2]=!S.unfold[mk2];mm.closest('.meb').classList.toggle('all',!!S.unfold[mk2]);mm.textContent=mm.getAttribute(S.unfold[mk2]?'data-t2':'data-t1');return}
  var mt=t.closest('[data-mebtoggle]');
  if(mt){var mk=mt.getAttribute('data-mebtoggle');S.open[mk]=!S.open[mk];mt.parentNode.classList.toggle('open',!!S.open[mk]);return}
  if(t.closest('[data-clear]')){setQ('');$q.focus();return}
  if(t.closest('[data-more]')){S.limit+=50;render();return}
  var f=t.closest('[data-fold]');
  if(f){var k=f.getAttribute('data-fold');S.unfold[k]=!S.unfold[k];render();return}
  var r=t.closest('[data-row]');
  if(r){var id=r.getAttribute('data-row');S.open[id]=!S.open[id];r.classList.toggle('open',!!S.open[id])}
});
window.addEventListener('scroll',function(){$up.classList.toggle('on',window.scrollY>600)},{passive:true});
$up.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});

fetch('data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  D=d;D.res=D.res||[];prep();setSec(S.sec);render();
}).catch(function(err){
  $main.innerHTML='<div class="empty"><b>Не удалось загрузить данные</b>Проверь интернет и обнови страницу. ('+esc(err.message)+')</div>';
});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
